# ai-hub.conf
#
# Nginx reverse proxy config for AI-Hub (Tencent Cloud)
#
# Replace `your-domain.com` with your real domain.
#
# Typical install location:
# - Ubuntu/Debian (recommended):
#   /etc/nginx/sites-available/ai-hub.conf
#   ln -s /etc/nginx/sites-available/ai-hub.conf /etc/nginx/sites-enabled/ai-hub.conf
# - Or use /etc/nginx/conf.d/ai-hub.conf

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name your-domain.com;

  # If you serve static verification txt under Next.js public/, Nginx can either:
  # 1) Let Next.js handle it (proxy), OR
  # 2) Serve it directly from disk via alias/root.
  #
  # Here we provide a dedicated location for WeCom verification files.
  # Put the verification txt file on the server at:
  #   /var/www/ai-hub/public/<your_verify_file>.txt
  # Then Nginx can serve it directly.

  location ~ ^/([\w-]+)\.txt$ {
    root /var/www/ai-hub/public;
    try_files /$1.txt =404;
    default_type text/plain;
    expires -1;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;

    # WebSocket / Next.js headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;

    # Real IP
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_bypass $http_upgrade;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
